<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати оголошення - Тернівка Об'яви</title>
    <!-- Підключення Supabase через надійний CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #012b28; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #ffce32; color: #012b28; border: none; padding: 10px 15px; font-weight: bold; width: 100%; cursor: pointer; border-radius: 4px; }
        button:hover { background: #e6b825; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #012b28; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← На головну</a>
        <h1>Створити оголошення</h1>

        <form id="adForm">
            <label>Назва оголошення:</label>
            <input type="text" id="title" required>

            <label>Категорія:</label>
            <select id="category">
                <option value="realty">Нерухомість</option>
                <option value="auto">Авто</option>
                <option value="work">Робота</option>
                <option value="services">Послуги</option>
                <option value="electronics">Електроніка</option>
                <option value="home">Дім та сад</option>
                <option value="other">Інше</option>
            </select>

            <label>Ціна (грн):</label>
            <input type="number" id="price">

            <label>Телефон:</label>
            <input type="text" id="phone">

            <label>Фото:</label>
            <input type="file" id="imageFile" accept="image/*">

            <button type="submit" id="submitBtn">Опублікувати</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://lpocqhvozuugcnzgquiu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ybld3op1Zra4aqnNEykSiw__28Xp-dC';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Публікація...';

            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    alert('Будь ласка, увійдіть у систему через головну сторінку!');
                    window.location.href = 'index.html';
                    return;
                }

                const title = document.getElementById('title').value;
                const category = document.getElementById('category').value;
                const price = document.getElementById('price').value;
                const phone = document.getElementById('phone').value;
                const fileInput = document.getElementById('imageFile');

                let imageUrl = '';

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `img_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '')}`;
                    
                    const { error: uploadError } = await supabaseClient.storage
                        .from('images')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: pubData } = supabaseClient.storage
                        .from('images')
                        .getPublicUrl(fileName);

                    imageUrl = pubData.publicUrl;
                }

                const { error: dbError } = await supabaseClient
                    .from('announcements')
                    .insert([{
                        title,
                        category,
                        price: price ? Number(price) : null,
                        phone,
                        image_url: imageUrl,
                        user_id: user.id
                    }]);

                if (dbError) throw dbError;

                alert('Оголошення успішно створено!');
                window.location.href = 'index.html';

            } catch (err) {
                alert('Помилка: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Опублікувати';
            }
        });
    </script>
</body>
</html>
