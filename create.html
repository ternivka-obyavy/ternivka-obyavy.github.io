<script>
    const SUPABASE_URL = 'https://lpocqhvozuugcnzgquiu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ybld3op1Zra4aqnNEykSiw__28Xp-dC';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function createAd() {
        const submitBtn = document.getElementById('submit-btn');
        
        try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert("Будь ласка, увійдіть у систему, щоб додати оголошення!");
                window.location.href = 'index.html';
                return;
            }

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const price = document.getElementById('price').value;
            const phone = document.getElementById('phone').value;
            const fileInput = document.getElementById('image-file');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Завантаження фото...';

            let imageUrl = '';

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                
                // Безпечна генерація імені файлу без кирилиці (розв'язує проблему зависання!)
                const fileExt = file.name.split('.').pop().toLowerCase();
                const fileName = `img_${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(fileName, file);

                if (uploadError) {
                    throw new Error("Помилка завантаження фото: " + uploadError.message);
                }

                const { data: publicURLData } = supabaseClient.storage
                    .from('images')
                    .getPublicUrl(fileName);

                imageUrl = publicURLData.publicUrl;
            }

            const { error: insertError } = await supabaseClient
                .from('announcements')
                .insert([
                    { 
                        title: title, 
                        category: category,
                        price: price ? Number(price) : null, 
                        phone: phone, 
                        image_url: imageUrl, 
                        user_id: user.id 
                    }
                ]);

            if (insertError) {
                throw new Error("Помилка бази даних: " + insertError.message);
            }

            alert("Оголошення успішно створено!");
            window.location.href = 'index.html';

        } catch (err) {
            alert(err.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Опублікувати оголошення';
        }
    }
</script>
