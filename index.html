<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тернівка Об'яви - Головна</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f9; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #ccc; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }
        
        /* Секція категорій */
        .categories-section {
            margin-bottom: 30px;
        }
        .categories-section h2 {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 15px;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
            background-color: white;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .category-card .icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }
        .category-card h3 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
        }

        /* Оголошення */
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 10px;
        }
        .btn { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Тернівка Об'яви</h1>
        <div id="user-info">
            <!-- Кнопка Telegram авторизації згенерується автоматично -->
        </div>
    </header>

    <!-- СЕКЦІЯ КАТЕГОРІЙ -->
    <section class="categories-section">
        <h2>Категорії оголошень</h2>
        <div class="categories-grid">
            <a href="catalog.html?category=realty" class="category-card">
                <span class="icon">🏠</span>
                <h3>Нерухомість</h3>
            </a>
            <a href="catalog.html?category=auto" class="category-card">
                <span class="icon">🚗</span>
                <h3>Авто</h3>
            </a>
            <a href="catalog.html?category=work" class="category-card">
                <span class="icon">💼</span>
                <h3>Робота</h3>
            </a>
            <a href="catalog.html?category=services" class="category-card">
                <span class="icon">🛠️</span>
                <h3>Послуги</h3>
            </a>
            <a href="catalog.html?category=electronics" class="category-card">
                <span class="icon">📱</span>
                <h3>Електроніка</h3>
            </a>
            <a href="catalog.html?category=home" class="category-card">
                <span class="icon">🛋️</span>
                <h3>Дім і сад</h3>
            </a>
        </div>
    </section>

    <!-- СЕКЦІЯ ОСТАННІХ ОГОЛОШЕНЬ -->
    <h2>Останні оголошення</h2>
    <div id="ads-container">Завантаження оголошень...</div>
</div>

<script>
    // Ініціалізація Supabase
    const SUPABASE_URL = 'https://lpocqhvozuugcnzgquiu.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Замініть на свій anon key
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Завантаження оголошень з БД
    async function fetchAds() {
        const container = document.getElementById('ads-container');
        const { data: ads, error } = await supabase
            .from('ads')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = '<p>Помилка завантаження оголошень.</p>';
            console.error(error);
            return;
        }

        if (!ads || ads.length === 0) {
            container.innerHTML = '<p>Оголошень поки немає.</p>';
            return;
        }

        container.innerHTML = ads.map(ad => `
            <div class="card">
                <h3>${escapeHtml(ad.title)}</h3>
                <p>${escapeHtml(ad.description)}</p>
                ${ad.image_url ? `<img src="${ad.image_url}" alt="${escapeHtml(ad.title)}">` : ''}
                <p><strong>Ціна:</strong> ${ad.price ? ad.price + ' грн' : 'Договірна'}</p>
                <small>Опубліковано: ${new Date(ad.created_at).toLocaleDateString('uk-UA')}</small>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Запуск завантаження при відкритті сторінки
    fetchAds();
</script>

</body>
</html>
