<!-- Модальне вікно авторизації -->
<div id="auth-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
  <div style="background:white; padding:25px; border-radius:12px; max-width:380px; width:90%; box-shadow:0 4px 20px rgba(0,0,0,0.2); position:relative; font-family:sans-serif;">
    <span id="close-auth-modal" style="cursor:pointer; position:absolute; top:12px; right:15px; font-size:22px; color:#aaa;">&times;</span>
    <h2 style="margin-top:0; margin-bottom:20px; font-size:20px; text-align:center; color:#333;">Вхід / Реєстрація</h2>

    <!-- Кнопка Google -->
    <button id="google-login-btn" style="width:100%; padding:11px; margin-bottom:15px; background:#fff; color:#444; border:1px solid #ddd; border-radius:6px; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:10px;">
      🌐 Увійти через Google
    </button>
    
    <div style="text-align:center; margin-bottom:15px; color:#888; font-size:14px; position:relative;">
      <span style="background:white; padding:0 10px; position:relative; z-index:1;">або через пошту</span>
      <hr style="border:none; border-top:1px solid #eee; position:absolute; top:50%; width:100%; margin:0; z-index:0;">
    </div>

    <!-- Форма пошта/пароль -->
    <form id="email-auth-form" onsubmit="return false;">
      <input type="email" id="auth-email" placeholder="Електронна пошта" required style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
      <input type="password" id="auth-password" placeholder="Пароль (мін. 6 символів)" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
      
      <div style="display:flex; gap:10px;">
        <button type="button" id="submit-login-btn" style="flex:1; padding:10px; background:#28a745; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Увійти</button>
        <button type="button" id="submit-signup-btn" style="flex:1; padding:10px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Реєстрація</button>
      </div>
    </form>
  </div>
</div>

<!-- Логіка Firebase та керування формою -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Ваша конфігурація Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCeMdGopJlzj29W1w6NV6bwC4ilRB_U8EQ",
    authDomain: "ternivka-obyavy.firebaseapp.com",
    projectId: "ternivka-obyavy",
    storageBucket: "ternivka-obyavy.firebasestorage.app",
    messagingSenderId: "613440072530",
    appId: "1:613440072530:web:1b4d8cdf41a94cc40fe88b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();

  // Логіка відкриття/закриття модального вікна (прив'яжіть до вашої кнопці "[Увійти / Реєстрація]")
  const modal = document.getElementById('auth-modal');
  const closeBtn = document.getElementById('close-auth-modal');

  // Приклад відкриття вікна (якщо ваша кнопка має текст або клас, замініть селектор нижче)
  document.addEventListener('click', (e) => {
    if (e.target.textContent.includes('Увійти / Реєстрація')) {
      modal.style.display = 'flex';
    }
  });

  closeBtn.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  window.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.style.display = 'none';
    }
  });

  // 1. Вхід через Google
  document.getElementById('google-login-btn').addEventListener('click', () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider)
      .then((result) => {
        modal.style.display = 'none';
      })
      .catch((error) => {
        alert("Помилка входу через Google: " + error.message);
      });
  });

  // 2. Реєстрація за поштою та паролем
  document.getElementById('submit-signup-btn').addEventListener('click', () => {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;

    if (!email || !password) {
      alert("Будь ласка, заповніть усі поля.");
      return;
    }

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        alert("Акаунт успішно створено!");
        modal.style.display = 'none';
      })
      .catch((error) => {
        alert("Помилка реєстрації: " + error.message);
      });
  });

  // 3. Вхід за поштою та паролем
  document.getElementById('submit-login-btn').addEventListener('click', () => {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;

    if (!email || !password) {
      alert("Будь ласка, заповніть усі поля.");
      return;
    }

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        modal.style.display = 'none';
      })
      .catch((error) => {
        alert("Помилка входу: " + error.message);
      });
  });

  // Відстеження стану користувача
  onAuthStateChanged(auth, (user) => {
    const authBtn = Array.from(document.querySelectorAll('button, a')).find(el => el.textContent.includes('Увійти / Реєстрація'));
    
    if (user) {
      if (authBtn) {
        authBtn.textContent = user.email; // Показуємо пошту замість кнопки входу
      }
      console.log("Користувач увійшов:", user.email);
    } else {
      if (authBtn) {
        authBtn.textContent = 'Увійти / Реєстрація';
      }
    }
  });
</script>
