<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тернівка Об'яви - Головна</title>
    
    <!-- Підключення Firebase SDK (Auth та Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f9; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #ccc; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
            background: #012b28;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
        }
        header h1 { margin: 0; font-size: 1.5rem; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Авторизація в шапці */
        .auth-block { display: flex; align-items: center; gap: 10px; }
        .user-name { font-weight: bold; }

        /* Секція категорій */
        .categories-section { margin-bottom: 30px; }
        .categories-section h2 { font-size: 1.4rem; color: #333; margin-bottom: 15px; }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
            background-color: white;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .category-card .icon { font-size: 1.8rem; margin-bottom: 6px; }
        .category-card h3 { margin: 0; font-size: 0.95rem; font-weight: bold; text-align: center; }

        /* Оголошення */
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .card img { max-width: 100%; height: auto; border-radius: 6px; margin-top: 10px; }
        
        .btn { 
            background: #00bcd4; 
            color: #012b28; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .btn:hover { background: #00acc1; color: white; }
        .btn-danger { background: #ff5252; color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📢 Тернівка Об'яви</h1>
        <div id="auth-container" class="auth-block">
            <!-- Динамічно заповнюється JS (Кнопка входу або профіль) -->
        </div>
    </header>

    <!-- СЕКЦІЯ КАТЕГОРІЙ -->
    <section class="categories-section">
        <h2>Категорії оголошень</h2>
        <div class="categories-grid">
            <a href="catalog.html?category=realty" class="category-card">
                <span class="icon">🏙️</span>
                <h3>Нерухомість</h3>
            </a>
            <a href="catalog.html?category=auto" class="category-card">
                <span class="icon">🚗</span>
                <h3>Авто</h3>
            </a>
            <a href="catalog.html?category=work" class="category-card">
                <span class="icon">💼</span>
                <h3>Робота</h3>
            </a>
            <a href="catalog.html?category=services" class="category-card">
                <span class="icon">🛠️</span>
                <h3>Послуги</h3>
            </a>
            <a href="catalog.html?category=electronics" class="category-card">
                <span class="icon">📱</span>
                <h3>Електроніка</h3>
            </a>
            <a href="catalog.html?category=home" class="category-card">
                <span class="icon">🏡</span>
                <h3>Дім та сад</h3>
            </a>
            <a href="catalog.html?category=sport" class="category-card">
                <span class="icon">⚽</span>
                <h3>Спорт</h3>
            </a>
            <a href="catalog.html?category=other" class="category-card">
                <span class="icon">📦</span>
                <h3>Інші</h3>
            </a>
        </div>
    </section>

    <!-- СЕКЦІЯ ОСТАННІХ ОГОЛОШЕНЬ -->
    <h2>Усі оголошення</h2>
    <div id="ads-container">Завантаження оголошень...</div>
</div>

<script>
    // ⚠️ Вставте сюди ваші реальні конфігураційні дані з Firebase Console
    const firebaseConfig = {
        apiKey: "ВАШ_API_KEY",
        authDomain: "ВАШ_AUTH_DOMAIN",
        projectId: "ternivka-obyavy",
        storageBucket: "ВАШ_STORAGE_BUCKET",
        messagingSenderId: "ВАШ_MESSAGING_SENDER_ID",
        appId: "ВАШ_APP_ID"
    };

    // Ініціалізація Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Логіка Google Auth та шапки сайту
    const provider = new firebase.auth.GoogleAuthProvider();

    function loginWithGoogle() {
        auth.signInWithPopup(provider).catch((error) => {
            console.error("Помилка входу:", error);
        });
    }

    function logout() {
        auth.signOut();
    }

    auth.onAuthStateChanged((user) => {
        const authContainer = document.getElementById('auth-container');
        if (user) {
            authContainer.innerHTML = `
                <span class="user-name">${user.displayName || user.email}</span>
                <a href="cabinet.html" class="btn">Мій кабінет</a>
                <button class="btn btn-danger" onclick="logout()">Вийти</button>
            `;
        } else {
            authContainer.innerHTML = `
                <button class="btn" onclick="loginWithGoogle()">Увійти через Google</button>
            `;
        }
    });

    // Завантаження оголошень із Firestore
    async function fetchAds() {
        const container = document.getElementById('ads-container');
        try {
            const querySnapshot = await db.collection('announcements').orderBy('createdAt', 'desc').get();
            
            if (querySnapshot.empty) {
                container.innerHTML = '<p>Оголошень поки немає.</p>';
                return;
            }

            let html = '';
            querySnapshot.forEach((doc) => {
                const ad = doc.data();
                html += `
                    <div class="card">
                        <h3>${escapeHtml(ad.title)}</h3>
                        <p>${escapeHtml(ad.description)}</p>
                        ${ad.imageUrl ? `<img src="${ad.imageUrl}" alt="Фото">` : ''}
                        <p><strong>Ціна:</strong> ${ad.price ? escapeHtml(ad.price) + ' грн' : 'Договірна'}</p>
                        <p><strong>Телефон:</strong> ${escapeHtml(ad.phone || 'Не вказано')}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = '<p>Помилка завантаження оголошень.</p>';
            console.error(error);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchAds();
</script>

</body>
</html>
