<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тернівка Об'яви</title>
    
    <!-- Підключення Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f9; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #012b28;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        header h1 { margin: 0; font-size: 1.5rem; color: white; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Кнопки в шапці */
        .auth-block { display: flex; align-items: center; gap: 10px; }
        .user-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Секція категорій */
        .categories-section { margin-bottom: 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .categories-section h2 { font-size: 1.2rem; color: #333; margin-bottom: 15px; margin-top: 0; }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
        }
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .category-card:hover {
            transform: translateY(-2px);
            background-color: #e9ecef;
        }
        .category-card .icon { font-size: 1.5rem; margin-bottom: 5px; }
        .category-card h3 { margin: 0; font-size: 0.85rem; font-weight: bold; text-align: center; }

        /* Оголошення */
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .card img { max-width: 100%; height: auto; border-radius: 6px; margin-top: 10px; }
        
        .btn { 
            background: #00bcd4; 
            color: #012b28; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .btn:hover { background: #00acc1; color: white; }
        .btn-danger { background: #ff5252; color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📢 Тернівка Об'яви</h1>
        <div id="auth-container" class="auth-block">
            <!-- Динамічно заповнюється JS -->
        </div>
    </header>

    <!-- СЕКЦІЯ КАТЕГОРІЙ -->
    <section class="categories-section">
        <h2>Категорії оголошень</h2>
        <div class="categories-grid">
            <a href="catalog.html?category=realty" class="category-card">
                <span class="icon">🏙️</span>
                <h3>Нерухомість</h3>
            </a>
            <a href="catalog.html?category=auto" class="category-card">
                <span class="icon">🚗</span>
                <h3>Авто</h3>
            </a>
            <a href="catalog.html?category=work" class="category-card">
                <span class="icon">💼</span>
                <h3>Робота</h3>
            </a>
            <a href="catalog.html?category=services" class="category-card">
                <span class="icon">🛠️</span>
                <h3>Послуги</h3>
            </a>
            <a href="catalog.html?category=electronics" class="category-card">
                <span class="icon">📱</span>
                <h3>Електроніка</h3>
            </a>
            <a href="catalog.html?category=home" class="category-card">
                <span class="icon">🏡</span>
                <h3>Дім та сад</h3>
            </a>
            <a href="catalog.html?category=sport" class="category-card">
                <span class="icon">⚽</span>
                <h3>Спорт</h3>
            </a>
            <a href="catalog.html?category=other" class="category-card">
                <span class="icon">📦</span>
                <h3>Інші</h3>
            </a>
        </div>
    </section>

    <!-- СЕКЦІЯ ОСТАННІХ ОГОЛОШЕНЬ -->
    <h2>Усі оголошення</h2>
    <div id="ads-container">Завантаження оголошень...</div>
</div>

<script>
    // Ваші дані проєкту Supabase
    const SUPABASE_URL = 'https://lpocqhvozuugcnzgquiu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ybld3op1Zra4aqnNEykSiw__28Xp-dC';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Функція входу через Google
    async function loginWithGoogle() {
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
        });
        if (error) {
            console.error('Помилка входу:', error.message);
        }
    }

    // Функція виходу
    async function logout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    // Перевірка стану авторизації та побудова шапки
    async function checkUser() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const authContainer = document.getElementById('auth-container');

        if (user) {
            const userName = user.user_metadata?.full_name || user.email;
            authContainer.innerHTML = `
                <a href="create.html" class="btn">+ Додати оголошення</a>
                <span class="user-badge">${userName}</span>
                <button class="btn btn-danger" onclick="logout()">Вийти</button>
            `;
        } else {
            authContainer.innerHTML = `
                <a href="create.html" class="btn">+ Додати оголошення</a>
                <button class="btn" onclick="loginWithGoogle()">Увійти через Google</button>
            `;
        }
    }

    // Завантаження оголошень з бази Supabase (таблиця announcements)
    async function fetchAds() {
        const container = document.getElementById('ads-container');
        try {
            const { data: ads, error } = await supabaseClient
                .from('announcements')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!ads || ads.length === 0) {
                container.innerHTML = '<p>Оголошень поки немає.</p>';
                return;
            }

            let html = '';
            ads.forEach(ad => {
                html += `
                    <div class="card">
                        <h3>${escapeHtml(ad.title)}</h3>
                        <p>${escapeHtml(ad.description)}</p>
                        ${ad.image_url ? `<img src="${ad.image_url}" alt="Фото">` : ''}
                        <p><strong>Ціна:</strong> ${ad.price ? escapeHtml(ad.price) + ' грн' : 'Договірна'}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = '<p>Помилка завантаження оголошень. Перевірте підключення до бази даних.</p>';
            console.error(error);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Запуск при завантаженні сторінки
    checkUser();
    fetchAds();
</script>

</body>
</html>
